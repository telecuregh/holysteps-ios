name: TestFlight

# Builds a signed Release version and uploads it to App Store Connect, where it appears in TestFlight (private testing,
# not the App Store). Run it from the Actions tab ("Run workflow"), push a tag named beta-<anything>, or push to the testflight branch.
#
# Needs three repository secrets (Settings › Secrets and variables › Actions), from an App Store Connect API key
# (Users and Access › Integrations › App Store Connect API, role Admin, so Xcode can create the signing certificate):
#   ASC_KEY_ID      the key's Key ID
#   ASC_ISSUER_ID   the Issuer ID shown above the keys list
#   ASC_KEY_P8      the whole text of the downloaded AuthKey_XXXX.p8 file
# The key file is written to the runner's temporary folder and deleted when the job ends.
#
# Apple limits each developer account to 2 iOS Development certificates. The "Revoke oldest Development cert"
# step automatically removes the oldest one when the account is at the limit, so the archive step can always
# create a fresh cert without hitting the cap.

on:
  workflow_dispatch:
  push:
    tags: ['beta-*']
    branches: [testflight]   # push main to this branch to build for TestFlight (used when tags can't be pushed)

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check the App Store Connect key is set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$ASC_KEY_P8" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets first:$missing"; exit 1; fi

      - name: Install XcodeGen and generate the project
        run: brew install xcodegen && xcodegen generate

      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Revoke oldest Development cert if at the 2-cert limit
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip3 install --quiet cryptography
          python3 - <<'PYEOF'
import os, sys, json, time, base64, urllib.request, urllib.error

key_id    = os.environ["ASC_KEY_ID"]
issuer_id = os.environ["ASC_ISSUER_ID"]
key_path  = os.path.join(os.environ["RUNNER_TEMP"], "AuthKey.p8")

# ── Generate a JWT for the App Store Connect API ──────────────────────────────
from cryptography.hazmat.primitives import hashes, serialization
from cryptography.hazmat.primitives.asymmetric import ec
from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature

with open(key_path, "rb") as f:
    private_key = serialization.load_pem_private_key(f.read(), password=None)

def b64url(data: bytes) -> str:
    return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

now     = int(time.time())
header  = b64url(json.dumps({"alg":"ES256","kid":key_id,"typ":"JWT"}).encode())
payload = b64url(json.dumps({"iss":issuer_id,"iat":now,"exp":now+1200,"aud":"appstoreconnect-v1"}).encode())
msg     = f"{header}.{payload}".encode()
r, s    = decode_dss_signature(private_key.sign(msg, ec.ECDSA(hashes.SHA256())))
token   = f"{header}.{payload}.{b64url(r.to_bytes(32,'big') + s.to_bytes(32,'big'))}"

# ── List iOS Development certificates ────────────────────────────────────────
BASE = "https://api.appstoreconnect.apple.com/v1"

def asc_get(path):
    req = urllib.request.Request(f"{BASE}/{path}",
                                 headers={"Authorization": f"Bearer {token}"})
    with urllib.request.urlopen(req) as resp:
        return json.loads(resp.read())

def asc_delete(path):
    req = urllib.request.Request(f"{BASE}/{path}", method="DELETE",
                                 headers={"Authorization": f"Bearer {token}"})
    try:
        with urllib.request.urlopen(req) as resp:
            return resp.status
    except urllib.error.HTTPError as e:
        return e.code

try:
    data  = asc_get("certificates?filter[certificateType]=IOS_DEVELOPMENT&limit=20")
    certs = data.get("data", [])
    print(f"iOS Development certificates on account: {len(certs)}")

    if len(certs) >= 2:
        # Sort ascending by expiration date — oldest first
        oldest = sorted(certs, key=lambda c: c["attributes"].get("expirationDate", ""))[0]
        cid    = oldest["id"]
        name   = oldest["attributes"].get("name", cid)
        exp    = oldest["attributes"].get("expirationDate", "unknown")
        print(f"At limit. Revoking oldest cert: '{name}'  expires={exp}  id={cid}")
        status = asc_delete(f"certificates/{cid}")
        if status in (200, 204):
            print("Revoked successfully — the archive step can now create a fresh cert.")
        else:
            print(f"Revoke returned HTTP {status}. The archive may still succeed if one cert expired.")
    else:
        print("Under the 2-cert limit — nothing to revoke.")

except Exception as exc:
    # Non-fatal: print the error but let xcodebuild try anyway.
    print(f"Warning: certificate pre-check failed ({exc}). Continuing with the build.")
PYEOF

      - name: Archive (Release, signed by Xcode with the API key)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project HolySteps.xcodeproj \
            -scheme HolySteps \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/HolySteps.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tee archive.log | grep -E "error:|warning: .*(sign|provision)|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Upload to App Store Connect (TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>4N2U2W77LM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/HolySteps.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tee export.log
          echo "Uploaded build ${{ github.run_number }}. It appears in TestFlight after Apple finishes processing (usually 10–30 minutes)."

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log

name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version && sw_vers -productVersion

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project HolySteps.xcodeproj \
            -scheme HolySteps \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Run tests on the simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "Simulator: $UDID"
          mkdir -p screenshots
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots" xcodebuild \
            -project HolySteps.xcodeproj \
            -scheme HolySteps \
            -destination "id=$UDID" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test | tee test.log | grep -E "error:|Test Case .*(passed|failed)|XCTAssert|TEST (SUCCEEDED|FAILED)|Executed" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Collect crash reports
        if: failure()
        run: |
          mkdir -p crashes
          find ~/Library/Logs/DiagnosticReports -iname "*HolySteps*" -mmin -60 -exec cp {} crashes/ ; 2>/dev/null || true
          xcrun xcresulttool get test-results tests --path TestResults.xcresult > crashes/tests.json 2>/dev/null || true
          ls crashes

      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashes
          path: crashes

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HolySteps-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/HolySteps.app

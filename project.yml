name: HolySteps
options:
  bundleIdPrefix: com.holysteps
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HolySteps:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio, location]
        UIAppFonts: [PlayfairDisplay-Italic.ttf, Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf, Inter-Bold.ttf, Fraunces-Medium.ttf, Fraunces-SemiBold.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: HolySteps.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.holysteps.app
        DEVELOPMENT_TEAM: 4N2U2W77LM
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HolySteps
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSHealthShareUsageDescription: HolySteps reads your steps and sleep to show your daily progress and your weekly recap. It stays on your phone.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: HolySteps does not write health data.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: HolySteps draws your walk on the map and measures how far you went. Your routes stay on your phone.
        INFOPLIST_KEY_NSCameraUsageDescription: HolySteps uses the camera only during a calm check, to see your fingertip's color. No pictures are taken or saved.
        INFOPLIST_KEY_NSMotionUsageDescription: HolySteps counts the steps and pace of your walks.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: HolyStepsWidget
        embed: true
  HolyStepsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Shared
      - path: Resources/fonts/PlayfairDisplay-Italic.ttf
        buildPhase: resources
      - path: Resources/fonts/Inter-SemiBold.ttf
        buildPhase: resources
      - path: Resources/fonts/Inter-Medium.ttf
        buildPhase: resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: HolySteps
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [PlayfairDisplay-Italic.ttf, Inter-SemiBold.ttf, Inter-Medium.ttf]
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.holysteps.app.widget
        DEVELOPMENT_TEAM: 4N2U2W77LM
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HolySteps
        SKIP_INSTALL: YES
  HolyStepsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Unit]
    dependencies:
      - target: HolySteps
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.holysteps.app.tests
  HolyStepsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: HolySteps
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.holysteps.app.uitests
        TEST_TARGET_NAME: HolySteps
schemes:
  HolySteps:
    build:
      targets:
        HolySteps: all
    test:
      config: Debug
      targets:
        - HolyStepsTests
        - HolyStepsUITests

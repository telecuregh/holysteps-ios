name: HolySteps
options:
  bundleIdPrefix: com.holysteps
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.0.0
targets:
  HolySteps:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio, location]
        HSScreenTimeEnabled: false
        HSJournalingEnabled: true
        GeminiApiKey: $(GEMINI_API_KEY)
        GeminiBaseUrl: $(GEMINI_BASE_URL)
        UIAppFonts: [PlayfairDisplay-Italic.ttf, Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf, Inter-Bold.ttf, Fraunces-Medium.ttf, Fraunces-SemiBold.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: HolySteps.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.journal.allow: [suggestions]
        com.apple.security.application-groups: [group.com.holysteps.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.holysteps.app
        DEVELOPMENT_TEAM: 4N2U2W77LM
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The discreet "Notes" home-screen icon the Cycle privacy settings can switch to.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconNotes
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HolySteps
        INFOPLIST_KEY_NSFaceIDUsageDescription: HolySteps uses Face ID only to unlock your Cycle tab when you turn on the Cycle lock.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSHealthShareUsageDescription: HolySteps reads your steps and sleep to show your daily progress and your weekly recap, and, only when you tap to bring them in, your period history and waking temperatures for the Cycle tab. It stays on your phone.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: With your OK, HolySteps saves the moods you log after prayer to Apple Health as State of Mind, and your prayer walks as workouts.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: HolySteps draws your walk on the map and measures how far you went. Your routes stay on your phone unless you share a walk with your safety circle or send an SOS.
        INFOPLIST_KEY_NSCameraUsageDescription: HolySteps uses the camera during a calm check, to see your fingertip's color, and in the Form Coach, to count your reps; neither is recorded. In the skin journal it takes the daily photo you choose to keep, which stays only on this iPhone.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: HolySteps uses the microphone only when you unmute yourself in a live room.
        INFOPLIST_KEY_NSMotionUsageDescription: HolySteps counts the steps and pace of your walks.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: HolyStepsWidget
        embed: true
      - target: HolyStepsWatch
      - package: LiveKit
  HolyStepsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Shared
      - path: Resources/fonts/PlayfairDisplay-Italic.ttf
        buildPhase: resources
      - path: Resources/fonts/Inter-SemiBold.ttf
        buildPhase: resources
      - path: Resources/fonts/Inter-Medium.ttf
        buildPhase: resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: HolySteps
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [PlayfairDisplay-Italic.ttf, Inter-SemiBold.ttf, Inter-Medium.ttf]
    entitlements:
      path: Widget/HolyStepsWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.holysteps.app]
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.holysteps.app.widget
        DEVELOPMENT_TEAM: 4N2U2W77LM
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HolySteps
        SKIP_INSTALL: YES
  HolyStepsWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
      - path: Sources/Shared/DailyVerses.swift
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: HolySteps
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.holysteps.app
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: HolySteps reads your steps, heart rate and distance during a prayer walk. It stays on your devices.
        NSHealthUpdateUsageDescription: HolySteps saves your prayer walks to Apple Health as workouts.
    entitlements:
      path: Watch/HolyStepsWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.holysteps.app.watchkitapp
        DEVELOPMENT_TEAM: 4N2U2W77LM
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HolySteps
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
  HolyStepsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Unit]
    dependencies:
      - target: HolySteps
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.holysteps.app.tests
  HolyStepsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: HolySteps
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.holysteps.app.uitests
        TEST_TARGET_NAME: HolySteps
schemes:
  HolySteps:
    build:
      targets:
        HolySteps: all
    test:
      config: Debug
      targets:
        - HolyStepsTests
        - HolyStepsUITests
